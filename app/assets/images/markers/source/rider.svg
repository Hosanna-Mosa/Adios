<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 52" width="56" height="52">
  <!-- Delivery rider on a scooter, 3/4 side view facing right, in the flat-shaded
       sticker style of marker_restaurant / marker_home. 1 unit = 1 dp. Ground point
       (the anchor) is (28, 47). -->
  <defs>
    <filter id="soft" x="-30%" y="-200%" width="160%" height="500%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <g stroke="#2A221D" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- ground shadow -->
    <ellipse cx="28.5" cy="47" rx="21" ry="3.4" fill="#1B1B22" opacity="0.22" stroke="none" filter="url(#soft)"/>

    <!-- far-side wheel depth -->
    <ellipse cx="12.6" cy="41.2" rx="5.4" ry="6" fill="#18191D"/>
    <ellipse cx="41.6" cy="41.2" rx="5.4" ry="6" fill="#18191D"/>

    <!-- rear rack + delivery box -->
    <path d="M5.2 28.6 L16.4 28.6 L16.4 30.2 L5.2 30.2 Z" fill="#3B3D47"/>
    <path d="M4 16.6 L7.4 14.4 L18.6 14.4 L15.2 16.6 Z" fill="#FFB061"/>
    <path d="M15.2 16.6 L18.6 14.4 L18.6 26.4 L15.2 28.6 Z" fill="#C2550A"/>
    <path d="M4 16.6 L15.2 16.6 L15.2 28.6 L4 28.6 Z" fill="#F07A1A"/>
    <circle cx="9.6" cy="22.6" r="3.1" fill="#FFFFFF" stroke="none"/>
    <path d="M8.5 20.6 L8.5 24.7 M7.7 20.6 L7.7 21.9 Q8.5 22.6 9.3 21.9 L9.3 20.6 M10.9 20.6 Q11.8 21.6 10.9 22.8 L10.9 24.7" fill="none" stroke="#F07A1A" stroke-width="0.55"/>

    <!-- rear body (cowl over the back wheel) -->
    <path d="M6.6 38.4 C6.4 32.6 10.2 30 16.6 30 L27.6 30.2 L28.8 36.8 L26.6 39.2 L9.2 39.2 Z" fill="#F07A1A"/>
    <path d="M6.6 38.4 C7.6 36.2 9.6 35.4 12.4 35.4 L28.4 35.4 L28.8 36.8 L26.6 39.2 L9.2 39.2 Z" fill="#C2550A"/>
    <path d="M10 31.6 C12.4 30.8 16 30.8 20 31" fill="none" stroke="#FFB061" stroke-width="0.9"/>
    <!-- seat -->
    <path d="M11.6 30.2 C11.6 28.4 13 27.8 15 27.8 L25.6 27.8 C26.8 27.8 27.4 28.6 27.2 30.2 Z" fill="#2E2F38"/>

    <!-- floorboard -->
    <path d="M26.4 37 L36.2 37 L35.6 39.4 L26 39.4 Z" fill="#3B3D47"/>

    <!-- front leg shield + steering column -->
    <path d="M33.6 39.4 L36.6 23.8 L40.6 22.6 L41.8 26.4 L38.8 39.4 Z" fill="#F07A1A"/>
    <path d="M38.8 39.4 L41.8 26.4 L43 27.4 L40.6 39.4 Z" fill="#C2550A"/>
    <path d="M37.6 25 L40 24.2" fill="none" stroke="#FFB061" stroke-width="0.9"/>
    <path d="M39.4 23 L40.8 18.4" fill="none" stroke="#2A221D" stroke-width="1.6"/>
    <!-- headlight -->
    <ellipse cx="42.2" cy="24.6" rx="1.3" ry="1.7" fill="#FFE27A"/>

    <!-- front fender over the wheel -->
    <path d="M36.4 37.6 C37.6 33.6 46.6 33 49.4 37.4 L48.2 38.6 C45.8 35.8 40.2 35.8 38.4 38.8 Z" fill="#F07A1A"/>

    <!-- near-side wheels -->
    <ellipse cx="14" cy="41.6" rx="5.6" ry="6" fill="#2C2D34"/>
    <ellipse cx="14" cy="41.6" rx="2.2" ry="2.5" fill="#DCE0E7"/>
    <ellipse cx="43" cy="41.6" rx="5.6" ry="6" fill="#2C2D34"/>
    <ellipse cx="43" cy="41.6" rx="2.2" ry="2.5" fill="#DCE0E7"/>

    <!-- rider: legs -->
    <path d="M17.4 26.4 L29.6 26 C31.4 26 32.4 27.2 32.2 28.8 L33.8 36.2 L30.6 36.8 L28.8 30.4 L18.6 30.6 Z" fill="#30323C"/>
    <path d="M30 36.4 L35.4 36 C36.2 36 36.6 36.6 36.4 37.4 L30.2 37.8 Z" fill="#17181C"/>

    <!-- rider: torso (jacket) -->
    <path d="M16.6 28.6 L18.6 18.2 C19.2 16.4 21 15.8 23 16 L26.4 16.4 C28.2 16.8 28.8 18.2 28.4 20 L26.8 28.2 Z" fill="#2E3F7A"/>
    <path d="M24.6 16.2 L26.4 16.4 C28.2 16.8 28.8 18.2 28.4 20 L26.8 28.2 L24.4 28.2 Z" fill="#22305E"/>
    <path d="M19 26.2 L26.2 26.2" fill="none" stroke="#F07A1A" stroke-width="1.1"/>

    <!-- rider: arm to the handlebar (outlined thick stroke) -->
    <path d="M25.8 18.8 L31 23.2 L38.4 19.8" fill="none" stroke="#2A221D" stroke-width="4"/>
    <path d="M25.8 18.8 L31 23.2 L38.4 19.8" fill="none" stroke="#3B4E92" stroke-width="2.8"/>
    <!-- handlebar + glove -->
    <path d="M37.8 18.6 L43.6 17.8" fill="none" stroke="#2A221D" stroke-width="1.5"/>
    <circle cx="38.8" cy="19.4" r="1.4" fill="#17181C"/>

    <!-- rider: helmet -->
    <circle cx="24" cy="11.4" r="5.4" fill="#F07A1A"/>
    <path d="M19.4 9.4 C20.6 6.6 24.4 5.4 27.4 7.6" fill="none" stroke="#FFB061" stroke-width="1.2"/>
    <path d="M24.8 9.6 L29.2 9.8 C29.6 11.4 29.2 13.4 28 14.6 L24.6 14 Z" fill="#2B2F3A"/>
    <path d="M25.8 10.6 L28.4 10.8" fill="none" stroke="#8FA3C7" stroke-width="0.7"/>
    <path d="M19 12.6 L23.6 12.8" fill="none" stroke="#C2550A" stroke-width="0.8"/>
  </g>
</svg>
