<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- A captain on a bike seen from above, facing up (north) so the map can turn it to
       the heading — the same 48x48 dp frame, palette and outline as marker_rider_top,
       but with no delivery box: rides, helpers and package deliveries. Food orders keep
       marker_rider_top. Rendered to marker_captain_top{,@2x,@3x}.png. -->
  <defs>
    <filter id="soft" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB061"/>
      <stop offset="0.42" stop-color="#F07A1A"/>
      <stop offset="1" stop-color="#C2550A"/>
    </linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B4E92"/>
      <stop offset="0.55" stop-color="#2E3F7A"/>
      <stop offset="1" stop-color="#22305E"/>
    </linearGradient>
    <radialGradient id="helmet" cx="0.36" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#FFB061"/>
      <stop offset="0.5" stop-color="#F07A1A"/>
      <stop offset="1" stop-color="#C2550A"/>
    </radialGradient>
  </defs>

  <!-- ground shadow, nudged down-right like the other top-view vehicles -->
  <ellipse cx="25.4" cy="25.4" rx="9.6" ry="20.6" fill="#1B1B22" opacity="0.24" filter="url(#soft)"/>

  <g stroke="#2A221D" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- wheels, edge-on from above: front (top) and rear (bottom) -->
    <rect x="21.9" y="1.8" width="4.2" height="9.4" rx="2.1" fill="#2C2D34"/>
    <rect x="21.7" y="37" width="4.6" height="9.6" rx="2.3" fill="#2C2D34"/>
    <path d="M23.1 3.4 L23.1 9.6" fill="none" stroke="#5A5C66" stroke-width="0.7"/>
    <path d="M23 38.8 L23 45" fill="none" stroke="#5A5C66" stroke-width="0.7"/>

    <!-- tail section over the rear wheel, with the tail light -->
    <path d="M20 32.4 L28 32.4 L27.2 40.6 Q24 42.6 20.8 40.6 Z" fill="url(#body)"/>
    <rect x="21.9" y="39.6" width="4.2" height="1.7" rx="0.85" fill="#E5322D"/>

    <!-- body: nose, tank and frame -->
    <path d="M24 8.2 C27.8 8.2 29.6 10.8 29.4 14.2 L28.8 21.8 C28.6 25.4 28.6 28.8 28.4 33 L19.6 33 C19.4 28.8 19.4 25.4 19.2 21.8 L18.6 14.2 C18.4 10.8 20.2 8.2 24 8.2 Z" fill="url(#body)"/>
    <path d="M21 11.6 C22 10.4 23.4 10 24.6 10.1" fill="none" stroke="#FFE0BF" stroke-width="0.8"/>
    <!-- headlight -->
    <ellipse cx="24" cy="9.3" rx="2" ry="1.2" fill="#FFE27A"/>

    <!-- seat, visible behind the rider -->
    <path d="M20.9 24.6 L27.1 24.6 C27.5 28.6 27.5 31.4 27.1 34.6 Q24 36.2 20.9 34.6 C20.5 31.4 20.5 28.6 20.9 24.6 Z" fill="#2E2F38"/>

    <!-- handlebar with mirrors -->
    <path d="M14.6 15 L12.4 11.4 M33.4 15 L35.6 11.4" fill="none" stroke="#2A221D" stroke-width="0.8"/>
    <ellipse cx="12" cy="10.6" rx="1.7" ry="1.25" fill="#9AACCD"/>
    <ellipse cx="36" cy="10.6" rx="1.7" ry="1.25" fill="#7F93B8"/>
    <path d="M12.8 15 L35.2 15" fill="none" stroke="#2A221D" stroke-width="1.7"/>

    <!-- rider: arms out to the grips -->
    <path d="M17.6 22.6 L15 15.8" fill="none" stroke="#2A221D" stroke-width="3.9"/>
    <path d="M30.4 22.6 L33 15.8" fill="none" stroke="#2A221D" stroke-width="3.9"/>
    <path d="M17.6 22.6 L15 15.8" fill="none" stroke="#3B4E92" stroke-width="2.7"/>
    <path d="M30.4 22.6 L33 15.8" fill="none" stroke="#2E3F7A" stroke-width="2.7"/>
    <circle cx="14.8" cy="15.2" r="1.55" fill="#17181C"/>
    <circle cx="33.2" cy="15.2" r="1.55" fill="#17181C"/>

    <!-- rider: shoulders and back -->
    <path d="M15.4 24.4 C15.4 20.2 19 18.2 24 18.2 C29 18.2 32.6 20.2 32.6 24.4 C32.6 28 29 29.6 24 29.6 C19 29.6 15.4 28 15.4 24.4 Z" fill="url(#jacket)"/>
    <path d="M17 27.2 C20.6 28.6 27.4 28.6 31 27.2" fill="none" stroke="#F07A1A" stroke-width="0.9"/>

    <!-- rider: helmet, visor towards the front -->
    <circle cx="24" cy="22.4" r="5.4" fill="url(#helmet)"/>
    <path d="M20.6 19.2 Q24 16 27.4 19.2" fill="none" stroke="#2B2F3A" stroke-width="1.5"/>
    <path d="M21.6 18.6 Q24 17.3 26.4 18.6" fill="none" stroke="#8FA3C7" stroke-width="0.5"/>
    <path d="M20.2 21.4 C20.8 20.6 21.6 20.2 22.4 20.1" fill="none" stroke="#FFE0BF" stroke-width="0.9"/>
    <path d="M24 20.2 L24 27.6" fill="none" stroke="#C2550A" stroke-width="0.7"/>
  </g>
</svg>
